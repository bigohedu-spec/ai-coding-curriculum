<!doctype html><meta charset="utf-8"><title>boss render</title>
<!-- 把遊戲 hc-pilot 的巨型機器人 3D 模型（boss_body/arml/armr.glb＋palette.png）渲染成透明姿勢圖。
     用法：把四個檔案複製到 public/_tmp/，把這個檔案也放進去，dev server 開 /_tmp/render.html，
     console 執行 await renderAll()，PNG 會 POST 到 /api/tmp-save-boss（暫時的 API）存到 C:/tmp/boss-render/。
     之後用 scripts/lesson-entry/boss-render/pack.py 裁切成 WebP＋meta.json。 -->
<style>html,body{margin:0;background:#888}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const S = 1000;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
r.setSize(S, S); r.setPixelRatio(1); r.setClearColor(0x000000, 0); document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8f9aa8, 1.7));
const dl = new THREE.DirectionalLight(0xffffff, 1.3); dl.position.set(3, 6, 5); scene.add(dl);
const H = 3.6, cam = new THREE.OrthographicCamera(-H, H, H, -H, 0.1, 100);
const L = new GLTFLoader(); const load = (u) => new Promise((res, rej) => L.load(u, (g) => res(g.scene), undefined, rej));
const tex = await new Promise((res, rej) => new THREE.TextureLoader().load("palette.png", res, undefined, rej));
tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace; tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
const [b, al, ar] = await Promise.all([load("boss_body.glb"), load("boss_arml.glb"), load("boss_armr.glb")]);
const root = new THREE.Group(); const pivot = new THREE.Group(); scene.add(pivot); pivot.add(root);
root.add(b); al.position.set(-1.2, 2.55, 0); ar.position.set(1.2, 2.55, 0); root.add(al); root.add(ar);
root.traverse((o) => { if (o.isMesh) o.material = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0 }); });
// 姿勢：arm＝兩手 x 軸旋轉（負＝往上舉、正＝往後擺）；lean＝整隻前傾；tilt＝歪頭（z）；sit＝往後坐倒
const POSES = {
  stand:    { armL: 0,    armR: 0,    lean: 0,    tilt: 0 },
  walk:     { armL: -0.55, armR: 0.45, lean: 0.12, tilt: 0 },
  slam:     { armL: -2.5, armR: -2.5, lean: -0.05, tilt: 0 },
  charge:   { armL: 0.7,  armR: 0.7,  lean: 0.38, tilt: 0 },
  panting:  { armL: 0.3,  armR: 0.3,  lean: 0.24, tilt: 0.04 },
  defeated: { armL: 0.25, armR: 0.35, lean: -0.95, tilt: 0.18 },
};
const AZ = 22, EL = 9;
function pose(name) {
  const p = POSES[name]; al.rotation.set(p.armL, 0, 0); ar.rotation.set(p.armR, 0, 0);
  pivot.rotation.set(0, 0, 0); root.position.set(0, 0, 0); root.rotation.set(p.lean, 0, p.tilt);
  pivot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root); root.position.y -= box.min.y; // 落地：最低點貼著 y=0
  pivot.updateMatrixWorld(true);
  const a = (AZ * Math.PI) / 180, e = (EL * Math.PI) / 180, d = 30, tx = 0, ty = 2.4, tz = 0;
  cam.position.set(tx + d * Math.sin(a) * Math.cos(e), ty + d * Math.sin(e), tz + d * Math.cos(a) * Math.cos(e)); cam.lookAt(tx, ty, tz);
  r.render(scene, cam);
}
window.pose = pose;
window.renderAll = async () => {
  const out = {};
  for (const n of Object.keys(POSES)) {
    pose(n);
    const data = r.domElement.toDataURL("image/png");
    const res = await fetch("/api/tmp-save-boss?name=" + n, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ data }) });
    out[n] = (await res.json()).bytes;
  }
  return out;
};
// 召喚台（boss_altar.glb）：同樣的相機與調色盤，落地後輸出 altar.png
const altarG = await load("boss_altar.glb"); altarG.traverse((o) => { if (o.isMesh) o.material = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0 }); });
window.renderAltar = async () => {
  scene.remove(pivot); const ap = new THREE.Group(); ap.add(altarG); scene.add(ap); ap.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(altarG); altarG.position.y -= box.min.y; ap.updateMatrixWorld(true);
  const a = (AZ * Math.PI) / 180, e = (EL * Math.PI) / 180, d = 30; cam.position.set(d * Math.sin(a) * Math.cos(e), 1.2 + d * Math.sin(e), d * Math.cos(a) * Math.cos(e)); cam.lookAt(0, 1.2, 0); r.render(scene, cam);
  const data = r.domElement.toDataURL("image/png");
  const res = await fetch("/api/tmp-save-boss?name=altar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ data }) });
  const info = { bytes: (await res.json()).bytes, size: box.getSize(new THREE.Vector3()).toArray().map((v) => +v.toFixed(2)) };
  scene.remove(ap); scene.add(pivot); return info;
};
pose("stand"); document.title = "ready";
</script>
